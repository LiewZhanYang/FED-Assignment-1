<header>
  <div class="logo-container">
    <div class="logo-pic">
      <i class="fas fa-book"></i>
    </div>
    <a routerLink="/" class="logo">Popular Bookstore</a>
  </div>

  <nav class="navbar" [class.mobile-open]="isMobileMenuOpen">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
    <a routerLink="/books" routerLinkActive="active">Books</a>
    <a routerLink="/stationery" routerLinkActive="active">Stationery</a>
    <a routerLink="/promotions" routerLinkActive="active">Promotions</a>
    <a routerLink="/contact" routerLinkActive="active">Contact Us</a>
    <a routerLink="/careers" routerLinkActive="active">Careers</a>
  </nav>

  <div class="header-actions">
    <div class="cart-icon" (click)="toggleCart()">
      <i class="fas fa-shopping-cart"></i>
      <span class="cart-count" *ngIf="(cartCount$ | async) as count">{{ count }}</span>
    </div>

    <div class="user-icon" (click)="navigateToAccount()">
      <i class="fas fa-user"></i>
    </div>

    <button class="mobile-menu-btn" (click)="toggleMobileMenu()">
      <i class="fas" [class.fa-bars]="!isMobileMenuOpen" [class.fa-times]="isMobileMenuOpen"></i>
    </button>
  </div>
</header>

<app-cart-sidebar [isOpen]="isCartOpen" (close)="toggleCart()"></app-cart-sidebar>
