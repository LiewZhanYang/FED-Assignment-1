<div class="cart-overlay" [class.open]="isOpen" (click)="closeCart()"></div>

<aside class="cart-sidebar" [class.open]="isOpen">
  <div class="cart-header">
    <h2 class="cart-title">
      <i class="fas fa-shopping-cart"></i> Shopping Cart
    </h2>
    <button class="close-cart" (click)="closeCart()">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <div class="cart-items">
    <ng-container *ngIf="(cartItems$ | async) as items">
      <div *ngIf="items.length === 0" class="empty-cart">
        <i class="fas fa-shopping-basket"></i>
        <p>Your cart is empty</p>
        <button class="browse-btn" (click)="closeCart()">Browse Products</button>
      </div>

      <div *ngFor="let item of items" class="cart-item">
        <img [src]="item.product.Image" [alt]="item.product.title">
        <div class="cart-item-info">
          <h4 class="cart-item-name">{{ item.product.title }}</h4>
          <p class="cart-item-price">${{ item.product.price }}</p>
          <div class="quantity-controls">
            <button class="qty-btn" (click)="updateQuantity(item.product.id, -1)">
              <i class="fas fa-minus"></i>
            </button>
            <span class="quantity">{{ item.quantity }}</span>
            <button class="qty-btn" (click)="updateQuantity(item.product.id, 1)">
              <i class="fas fa-plus"></i>
            </button>
          </div>
        </div>
        <button class="remove-btn" (click)="removeItem(item.product.id)">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </ng-container>
  </div>

  <div class="cart-footer" *ngIf="(cartItems$ | async)?.length">
    <div class="cart-total">
      <span>Total:</span>
      <span class="total-amount">${{ (cartTotal$ | async) || 0 }}</span>
    </div>
    <button class="checkout-btn" (click)="goToCheckout()">
      <i class="fas fa-credit-card"></i> Proceed to Checkout
    </button>
  </div>
</aside>
